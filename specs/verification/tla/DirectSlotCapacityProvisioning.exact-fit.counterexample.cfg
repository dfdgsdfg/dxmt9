\* Provisioning removed: an empty slot is reserved to exactly the first
\* source's plan, so `size() = capacity()` and every adjacent source rotates.
\* This is the measured HEAD regression -- GT1 19,854/20,631 continuations
\* rotating -- and it shows up here as Direct publishing more often than the
\* same-capacity serial reference.
SPECIFICATION Spec

CONSTANTS
  ProvisionDiscipline = "Removed"
  EmptyOnlyDiscipline = "Enforced"
  ReuseDiscipline = "Enforced"
  RetentionDiscipline = "Enforced"
  ReuseQualification = "Enforced"
  LeaseDiscipline = "Settled"
  Budget = 4

INVARIANTS
  TypeOK
  ProvisionOnlyWhenEmpty
  NoGrowWhilePopulated
  CapacityBoundsConstruction
  BoundaryCreditsNotExceeded
  NoRedundantReprovision
  ReuseRequiresCompleteRetention
  ReuseIsLedgerQualified
