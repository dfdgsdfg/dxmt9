INVARIANT CaptureDoesNotEnlargeTrackedSet
INVARIANT PreparedIsNonConsuming
INVARIANT OnlyAcceptedConsumes
INVARIANT AcceptedExactlyRepresented
INVARIANT FailedRetryStable
