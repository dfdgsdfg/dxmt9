\* TLC model checker configuration for ConcurrentProgressSignals.tla
\*
\* Run with:
\*   tlc ConcurrentProgressSignals.tla -config ConcurrentProgressSignals.cfg
\*
\* Bounds chosen for tractability — the three liveness properties only need
\* enough room for each axis to advance independently of the others' waits:
\*   MaxRing=3          covers ring-full with at least one non-present and one present
\*   MaxFrameLatency=2  covers frameLatencyFull while non-present submissions advance
\*   Queries={q1,q2}    covers concurrent issued queries
\*   MaxSeqId=4         enough seqIds to drain a full ring at least once
\*
\* If TLC times out on a slower machine, drop to MaxRing=2, MaxFrameLatency=1,
\* Queries={q1}; the cross-axis liveness arguments do not need larger bounds.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* -- Constants ------------------------------------------------------
CONSTANTS
  MaxRing         = 3
  MaxFrameLatency = 2
  MaxSeqId        = 4
  Queries         = {q1, q2}

\* -- Safety invariants ---------------------------------------------
INVARIANT TypeOK
INVARIANT PacingOrdering
INVARIANT RingOccupancyBound
INVARIANT FrameLatencyBound
INVARIANT OutstandingAccounting

\* -- Liveness (cross-axis non-blocking — closes audit gap G1) ------
PROPERTY NoQueryWaitBlocksPresent
PROPERTY NoFrameLatencyBlocksQuery
PROPERTY NoRingPressureBlocksPresentCompletion
