\* Deliberate regression configuration for BufferMutationOffload.tla — premise 2.
\*
\* `RotationDiscipline = "Deferred"` moves exactly one thing — the LOGICAL
\* rename-ring rotation (`renameActiveIndex` / `record.buffer` /
\* `record.contents` / `contentRevision`) — from the producer's unlock
\* transaction onto the offload worker, so the whole unlock becomes deferred
\* rather than only its byte motion. Nothing else changes: the queue is still
\* one FIFO, application is still strictly ordered against chunk replay, and
\* the rename-ring selection gate is still the production gate, now evaluated
\* at apply time.
\*
\* This is the tempting simplification R-BACK-44.2 step 2 forbids, and its
\* failure is a wrong-content bug that leaves no incoherent read behind. The
\* app's `Unlock` returns; a chunk commits in the window before the worker gets
\* to the task; `Pool::captureChunkBufferBinding` freezes the OLD backing and
\* the OLD `contentRevision`, because that is still what the record says; the
\* chunk's draws then render the pre-unlock content, self-consistently. Every
\* byte read in that trace agrees with its own snapshot, which is why
\* `EncodeReadsAppliedBytes` cannot see it and this premise needs an invariant
\* of its own.
\*
\* Expected to FAIL `SnapshotRevisionIsCurrent`. Only `TypeOK` accompanies it:
\* every other invariant still holds under deferral (the model checks that in
\* the sibling configurations), and listing them would add nothing while
\* risking a shorter unrelated trace being reported instead.
\* `scripts/check/verify_tla.sh` executes this configuration as an expected
\* failure and checks for that exact invariant.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
  Backings = {b1, b2}
  NoBacking = none
  NumChunks = 2
  NumMutations = 1
  MAX_ORDINAL = 4
  FifoDiscipline = "Enforced"
  RotationDiscipline = "Deferred"

INVARIANT TypeOK
INVARIANT SnapshotRevisionIsCurrent

PROPERTY RecordRevisionMonotonic
PROPERTY LogicalRevisionMonotonic
PROPERTY OrdinalMonotonic
