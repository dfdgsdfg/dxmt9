\* TLC model checker configuration for DrawableToken.tla
\*
\* Models the lifecycle of dxmt9::PresentDrawableToken and its handoff
\* through CommandQueue::stashDrawableToken / takeDrawableToken.
\*
\* Run with:
\*   tlc DrawableToken.tla -config DrawableToken.cfg
\*
\* Small model — exhaustive BFS completes in well under a second:
\*   2 pids, 2 distinct drawable values.  Verifies all token states for
\*   each pid plus the cross-pid action interleavings.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* ── Constants ──────────────────────────────────────────────────────
CONSTANTS
  MAX_PIDS  = 2
  Drawables = {D1, D2}

\* ── Invariants (checked on every reachable state) ──────────────────
INVARIANT TypeOK
INVARIANT NoDoubleComplete
INVARIANT NoUseAfterTake
INVARIANT StashTakeOrdering
INVARIANT DrawableValueShape

\* ── Temporal safety properties ─────────────────────────────────────
PROPERTY TakenIsSink
PROPERTY FulfilledMonotonic

\* ── Liveness (checked over all infinite behaviours) ────────────────
PROPERTY WaitProgress
PROPERTY EventuallyResolved
