\* Deliberate regression configuration for ReplayEmissionPlanIslands.tla.
\*
\* `RunClosureDiscipline = "Removed"` drops the explicit run closure at a span
\* cut, so the DrawRunCommandRecord opened by the first island is still open
\* when the separator executes. `Draw, Draw, <cut>, Draw` then yields one run
\* record spanning the cut instead of two, and the separator's effect lands
\* inside a run it must precede.
\*
\* Expected to FAIL `RunClosedAcrossSeparator`.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
  SpanIdentityDiscipline = "Enforced"
  SeparatorCutDiscipline = "Enforced"
  RunClosureDiscipline = "Removed"

INVARIANT TypeOK
INVARIANT RunClosedAcrossSeparator
