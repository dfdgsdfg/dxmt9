\* Deliberate regression configuration for ReplayEmissionPlanIslands.tla.
\*
\* The populated slot already owns a predecessor raw. Replacing the active
\* raw's exact witness interval with the slot aggregate makes the second span
\* compare its event/source interval against unrelated older ownership. This
\* recreates the positive-headroom GT1 failure discovered after a
\* Direct -> TriangleFan -> Direct source had already executed its prefix.
\*
\* Expected to FAIL `RawLocalWitnessSeparated`.

SPECIFICATION Spec
