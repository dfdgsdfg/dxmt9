\* R-BACK-2.105, premise 2 removed: reclaim keeps the payload's BYTES but not
\* its shape. This is the `detachResourceOwners()` shape -- `drawShaderLayouts`
\* is moved out and the moved-from vector has capacity 0 -- so a payload that
\* looks sufficient by byte total has lost one of the dimensions the next
\* source must construct into. A bytes-only skip rule accepts it; the
\* per-dimension predicate must not.
SPECIFICATION Spec

CONSTANTS
  ProvisionDiscipline = "Enforced"
  EmptyOnlyDiscipline = "Enforced"
  ReuseDiscipline = "Enforced"
  RetentionDiscipline = "Removed"
  ReuseQualification = "Enforced"
  LeaseDiscipline = "Settled"
  Budget = 4

INVARIANTS
  TypeOK
  ReuseRequiresCompleteRetention
  ProvisionOnlyWhenEmpty
  NoGrowWhilePopulated
  CapacityBoundsConstruction
  BoundaryCreditsNotExceeded
  NoRedundantReprovision
  ReuseIsLedgerQualified
