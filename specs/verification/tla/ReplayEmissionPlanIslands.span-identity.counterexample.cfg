\* Deliberate regression configuration for ReplayEmissionPlanIslands.tla.
\*
\* `SpanIdentityDiscipline = "Removed"` deletes the active-raw witness check,
\* so a span is admitted without proving it is the immediate successor of the
\* last committed span of the exact witnessed raw. TLC then reaches
\* `BeginDuplicateSpan0` -- the producer re-presenting span ordinal 0 after it
\* has already committed -- and the raw's first span is emitted twice.
\*
\* This is the reason the same-raw rule is a separate witnessed predicate
\* rather than a relaxation of `compatibilityProducerIdentityAppendable`:
\* every span of one raw carries the identical closed producer interval, so
\* interval equality alone cannot tell a legitimate successor from a repeat.
\*
\* Expected to FAIL `EachRecordEmittedOnce`.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
  SpanIdentityDiscipline = "Removed"
  RawLocalWitnessDiscipline = "Enforced"
  SeparatorCutDiscipline = "Enforced"
  RunClosureDiscipline = "Enforced"

INVARIANT TypeOK
INVARIANT EachRecordEmittedOnce
