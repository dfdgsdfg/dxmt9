\* Deliberate regression configuration for ProducerMarkReclaim.tla.
\*
\* `PinDiscipline = "Removed"` deletes exactly one conjunct — the
\* `~IsPinned(r)` guard on SetDestroyPending — i.e. the world in which pins do
\* NOT protect the mark window. Nothing else changes: the reclaim gate stays
\* the production gate (`destroyPending /\ lastUsedSeqId <= completedSeqId`),
\* and marking stays lock-free.
\*
\* This is expected to FAIL `NoUseAfterFree`. A run that goes green means the
\* model can no longer see the bug class it exists to guard, which per design
\* §4 means it proves nothing — `scripts/check/verify_tla.sh` executes this
\* configuration as an expected failure and checks for that exact invariant.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
  Resources = {r1, r2}
  MAX_SEQID = 3
  PinDiscipline = "Removed"

INVARIANT TypeOK
INVARIANT NoUseAfterFree
INVARIANT NoReclaimInsideMarkWindow
INVARIANT ReclaimRespectsWatermark
INVARIANT MapReadSound

PROPERTY MarkMonotonic
PROPERTY CompletedMonotonic
PROPERTY ObservedCompletedMonotonic
