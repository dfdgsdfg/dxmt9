\* Deliberate regression configuration for ProducerMarkReclaim.tla — the T2b
\* capture-side violation.
\*
\* This file deletes the SAME premise as
\* `ProducerMarkReclaim.counterexample.cfg` (`PinDiscipline = "Removed"` drops
\* the `~IsPinned(r)` guard on SetDestroyPending) and is deliberately NOT a new
\* Buggy axis: design §8's T2b row leaves the capture exactly one safety
\* obligation beyond the Q1 read-set audit — the record still exists — and the
\* pin chain IS that obligation's proof. A `CapturePinDiscipline` constant
\* would remove the same conjunct under a second name.
\*
\* What differs from the sibling is only which invariant TLC is asked to
\* report. `NoUseAfterFree` is violated three steps in
\* (PinChunkResources → SetDestroyPending → Reclaim, the mark-window case), so
\* listing it here would shadow the capture trace — the fault flag is already
\* set by that Reclaim, and TLC reports the first invariant that fails.
\* Listing only `NoCaptureAfterFree` makes TLC run the behaviour on to the
\* capture itself (observed trace, 6 steps / search depth 8):
\*
\*   PinChunkResources({r1}) → BeginMark → SetDestroyPending(r1) → Reclaim(r1)
\*     → StampMark(r1) → CaptureRead(r1)
\*
\* i.e. `captureChunkBufferBinding` reading a `BufferRecord` whose HandleArena
\* slot `gcArena` has already released, and publishing it into the chunk's
\* `bufferSnapshots` as a live backing. Note the two steps AFTER the free: the
\* production mark/capture loops walk the chunk's resource list and re-check
\* nothing, which is exactly why the pin has to be the guarantee. Under the
\* production configuration the pin makes `SetDestroyPending` unreachable while
\* the record is chunk-named, and that is what licenses the capture to leave
\* `CommandQueue::mutex_`.
\*
\* Expected to FAIL `NoCaptureAfterFree`. `scripts/check/verify_tla.sh`
\* executes this configuration as an expected failure and checks for that
\* exact invariant.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
  Resources = {r1, r2}
  MAX_SEQID = 3
  PinDiscipline = "Removed"
  RestampDiscipline = "Enforced"

INVARIANT TypeOK
INVARIANT NoCaptureAfterFree

PROPERTY MarkMonotonic
PROPERTY CompletedMonotonic
PROPERTY ObservedCompletedMonotonic
