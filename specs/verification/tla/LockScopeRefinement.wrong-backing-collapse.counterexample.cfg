\* Deliberately stores only the logical handle's active/collapsed backing.
\* A rotation then makes the captured concrete backing differ from reality.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
  Positions = {p0, p1, p2, p3}
  ReadPositions = {p0, p1}
  WritePositions = {p2, p3}
  InitialReadValue = 7
  ApplicationValue = 9
  LogicalHandle = h0
  ActiveGeneration = 1
  Backings = {a, b}
  CollapsedBacking = a
  MaxCaptures = 3
  Implementation = "WrongBackingCollapse"

INVARIANT TypeOK
INVARIANT CapturedBackingExact
