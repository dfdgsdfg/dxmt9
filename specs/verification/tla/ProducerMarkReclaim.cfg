\* TLC model checker configuration for ProducerMarkReclaim.tla
\*
\* Production configuration: the pin-ordering premise is enforced, so
\* lock-free commit-time marking and binding capture (design T2a / T2b) are
\* safe against a concurrently reclaiming worker or completion thread.
\*
\* Run with:
\*   tlc ProducerMarkReclaim.tla -config ProducerMarkReclaim.cfg

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* ── Constants ──────────────────────────────────────────────────────
\* Two resources are enough for the A -> B -> A overlap the model needs
\* (chunk N and chunk N+1 sharing one resource while the worker drops the
\* other), per rendering_correctness.rules.md's small-domain guidance.
CONSTANTS
  Resources = {r1, r2}
  MAX_SEQID = 3
  PinDiscipline = "Enforced"

\* ── Invariants ─────────────────────────────────────────────────────
INVARIANT TypeOK
INVARIANT NoUseAfterFree
INVARIANT NoReclaimInsideMarkWindow
INVARIANT ReclaimRespectsWatermark
INVARIANT PinnedRecordsAreNotDestroyPending
INVARIANT MapReadSound

\* ── Action properties ──────────────────────────────────────────────
PROPERTY MarkMonotonic
PROPERTY CompletedMonotonic
PROPERTY ObservedCompletedMonotonic
