\* TLC model checker configuration for ProducerMarkReclaim.tla
\*
\* Production configuration: both premises are enforced, so lock-free
\* commit-time marking (design T2a), lock-free replay-worker batch marking
\* (T2a'), lock-free binding capture (T2b), and the map fast path's atomic
\* watermark read (T2c) are safe against a concurrently reclaiming worker or
\* completion thread AND against a concurrent force-publish that moves the seq
\* a pending append will land under.
\*
\* Run with:
\*   tlc ProducerMarkReclaim.tla -config ProducerMarkReclaim.cfg

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* ── Constants ──────────────────────────────────────────────────────
\* Two resources are enough for the A -> B -> A overlap the model needs
\* (chunk N and chunk N+1 sharing one resource while the worker drops the
\* other), per rendering_correctness.rules.md's small-domain guidance.
\* MAX_SEQID = 3 is the smallest bound that still admits the whole
\* ticket -> SlotAdvance -> append -> publish -> complete chain the re-stamp
\* obligation lives on.
CONSTANTS
  Resources = {r1, r2}
  MAX_SEQID = 3
  PinDiscipline = "Enforced"
  RestampDiscipline = "Enforced"

\* ── Invariants ─────────────────────────────────────────────────────
INVARIANT TypeOK
INVARIANT NoUseAfterFree
INVARIANT NoReclaimInsideMarkWindow
INVARIANT ReclaimRespectsWatermark
INVARIANT PinnedRecordsAreNotDestroyPending
INVARIANT MapReadSound
INVARIANT WorkerAppendCoveredByStamps
INVARIANT CommitStampsCoverChunkSeq
\* T2b: the capture's existence obligation and the stamps-before-capture
\* ordering, now that neither is a side effect of holding CommandQueue::mutex_.
INVARIANT NoCaptureAfterFree
INVARIANT StampsPrecedeCapture

\* ── Action properties ──────────────────────────────────────────────
PROPERTY MarkMonotonic
PROPERTY CompletedMonotonic
PROPERTY ObservedCompletedMonotonic
