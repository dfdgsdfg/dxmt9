\* TLC model checker configuration for EncoderLifecycle.tla

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* ── Constants ──────────────────────────────────────────────────────
\* Handles kept small (=3 → |SUBSET Handles| = 8) to keep TLC tractable.
\* T4 (Bloom diagnostic-only model) added a BOOLEAN bloomSignal which
\* roughly doubles the reachable state space, so Handles was reduced from
\* 4 to 3 and bloomFalsePositiveCount is bounded by MAX_OPS so it does
\* not blow the state count further. RenderTargets and MAX_OPS stay tight
\* to keep the suite well under ~30s wall on a workstation.
CONSTANTS
  MAX_OPS       = 5
  RenderTargets = {rt1, rt2}
  Handles       = {h1, h2, h3}

\* ── Invariants ─────────────────────────────────────────────────────
INVARIANT TypeOK
INVARIANT RenderTargetConsistency
INVARIANT ExactHazardBlocksMerge
INVARIANT BloomNeverForcesSplit

\* ── Temporal safety ────────────────────────────────────────────────
PROPERTY KindSwitchThroughIdle

\* ── Liveness ───────────────────────────────────────────────────────
PROPERTY ActiveEncoderEventuallyEnds
