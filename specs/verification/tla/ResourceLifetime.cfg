\* TLC model checker configuration for ResourceLifetime.tla
\*
\* Run with:
\*   tlc ResourceLifetime.tla -config ResourceLifetime.cfg

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* ── Constants ──────────────────────────────────────────────────────
\* Use a small set of 2-3 resources for tractable state space.
\* Two resources are the minimum required to exercise the case where the
\* encoder holds one record while another is being freed.
CONSTANTS
  Resources = {r1, r2}
  MAX_SEQID = 4

\* ── Invariants ─────────────────────────────────────────────────────
INVARIANT TypeOK
INVARIANT NoUseAfterFree
INVARIANT PrematureFreeImpossible
INVARIANT SlotIdentityStable
INVARIANT EncoderPointerStable

\* ── Liveness ───────────────────────────────────────────────────────
PROPERTY DestroyPendingEventuallyFreed
PROPERTY EncoderEventuallyReleases
