\* TLC model checker configuration for ResourceLifetime.tla
\*
\* Run with:
\*   tlc ResourceLifetime.tla -config ResourceLifetime.cfg

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* ── Constants ──────────────────────────────────────────────────────
\* Two resources distinguish independent arena/initializer ownership while
\* keeping the new Pending/InFlight cross product tractable.
CONSTANTS
  Resources = {r1, r2}
  MAX_SEQID = 3
  Implementation = "Retained"

\* ── Invariants ─────────────────────────────────────────────────────
INVARIANT TypeOK
INVARIANT NoUseAfterFree
INVARIANT PrematureFreeImpossible
INVARIANT InitializerReferenceSafety
INVARIANT MetalReleaseAfterAllOwners

\* ── Liveness ───────────────────────────────────────────────────────
PROPERTY DestroyPendingEventuallyFreed
PROPERTY InitializerEventuallySettled
PROPERTY FreedEventuallyMetalReleased
