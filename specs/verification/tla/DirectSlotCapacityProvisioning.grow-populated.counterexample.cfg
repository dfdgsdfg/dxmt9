\* Empty-only discipline removed: a populated slot buys capacity by
\* re-provisioning, which reallocates and copies an already published extent
\* and rehashes its uniform lookup tables. Forbidden by R-BACK-2.104.
SPECIFICATION Spec

CONSTANTS
  ProvisionDiscipline = "Enforced"
  EmptyOnlyDiscipline = "Removed"
  Budget = 4

INVARIANTS
  TypeOK
  NoGrowWhilePopulated
  ProvisionOnlyWhenEmpty
  CapacityBoundsConstruction
  BoundaryCreditsNotExceeded
