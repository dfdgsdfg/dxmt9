\* Deliberate regression configuration for BufferMutationOffload.tla — premise 1.
\*
\* `FifoDiscipline = "Removed"` deletes exactly two conjuncts — the
\* chunk-vs-mutation ordering premise in `ReplayChunk` and its mirror in
\* `ApplyMutation` — i.e. the world design §4 rejected: a SECOND queue carrying
\* mutation tasks, ordered among themselves but not against chunk replay.
\* Nothing else changes: chunks are still FIFO among themselves, mutations are
\* still FIFO among themselves, rotation is still synchronous, and the
\* rename-ring selection gate is still the production gate.
\*
\* The trace is the one sentence the single queue buys. The producer rotates to
\* a fresh backing and commits the task; the next chunk captures that backing
\* and the new `contentRevision`; the worker replays that chunk without first
\* draining the mutation ahead of it; the encode worker then reads the captured
\* backing and finds the PRE-mutation bytes — a draw rendering with content the
\* app overwrote before the draw was ever recorded.
\*
\* Expected to FAIL `EncodeReadsAppliedBytes`. `FifoApplicationOrder` — the
\* premise stated directly — is deliberately NOT listed here, because it is
\* violated at the ReplayChunk step, two states before the encode, and listing
\* it would report the deleted premise instead of the damage it does.
\* `scripts/check/verify_tla.sh` executes this configuration as an expected
\* failure and checks for that exact invariant.
\*
\* Two backings suffice here: the shortest violating trace needs one rotation
\* away from the initial entry and no ring pressure at all.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
  Backings = {b1, b2}
  NoBacking = none
  NumChunks = 2
  NumMutations = 1
  MAX_ORDINAL = 4
  FifoDiscipline = "Removed"
  RotationDiscipline = "Synchronous"

INVARIANT TypeOK
INVARIANT EncodeReadsAppliedBytes
\* Still hold with the FIFO premise removed, and are listed to prove the
\* deletion is surgical: rotation stays synchronous, the ring gate still
\* excludes live captures, and the reserve/rotate/commit transaction is intact.
INVARIANT SnapshotRevisionIsCurrent
INVARIANT NoLiveCaptureOverwritten
INVARIANT OrdinalsAreUnique
INVARIANT PublishedRevisionCount
INVARIANT RecordRevisionCountsRotations
INVARIANT TaskCarriesRotatedTarget

PROPERTY RecordRevisionMonotonic
PROPERTY LogicalRevisionMonotonic
PROPERTY OrdinalMonotonic
