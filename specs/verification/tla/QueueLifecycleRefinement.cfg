\* TLC model checker configuration for QueueLifecycleRefinement.tla
\*
\* Run with:
\*   tlc QueueLifecycleRefinement.tla -config QueueLifecycleRefinement.cfg
\*
\* Small model values:
\*   RING_SIZE=3 exercises write-index wrap-around.
\*   MAX_INFLIGHT=2 matches the queue back-pressure shape while keeping
\*   queued ready/completion permutations tractable.
\*   MAX_SEQID=4 is enough to cover repeated publish/complete/reclaim cycles.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* -- Constants ------------------------------------------------------
CONSTANTS
  RING_SIZE = 3
  MAX_INFLIGHT = 2
  MAX_SEQID = 4

\* -- Invariants -----------------------------------------------------
INVARIANT TypeOK
INVARIANT ReadySlotsPending
INVARIANT ReadySlotsUnique
INVARIANT PendingCompletionWellFormed
INVARIANT CompletedSeqQueueBound
INVARIANT CompletedSeqIdBound
INVARIANT BoundedInflight
INVARIANT WriterSlotSafety
INVARIANT SeqIdAssignmentSafety
INVARIANT WaitEndRecordSafety

\* -- Temporal safety ------------------------------------------------
PROPERTY WaitForSequenceSafety
PROPERTY ConcreteSlotLifecycleRefinesAbstract
