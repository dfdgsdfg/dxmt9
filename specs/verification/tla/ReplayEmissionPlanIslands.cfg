\* TLC model checker configuration for ReplayEmissionPlanIslands.tla
\*
\* Production configuration: all three lease-span disciplines are enforced, so
\* one raw may own several consecutive final-slot leases separated by ordered
\* controls and compatibility ranges without ever re-emitting a record,
\* handing an executed prefix back to Legacy, or letting a draw run straddle a
\* cut.
\*
\* Run with:
\*   tlc ReplayEmissionPlanIslands.tla -config ReplayEmissionPlanIslands.cfg

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
  SpanIdentityDiscipline = "Enforced"
  SeparatorCutDiscipline = "Enforced"
  RunClosureDiscipline = "Enforced"

INVARIANT TypeOK
INVARIANT EachRecordEmittedOnce
INVARIANT NoLegacyRetryAfterSeparator
INVARIANT RunClosedAcrossSeparator
INVARIANT SpanAdmissionWitnessed
INVARIANT NoPostSettlementExtension
INVARIANT FailStopIsTerminal
