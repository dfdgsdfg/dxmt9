\* TLC model checker configuration for BufferMutationOffload.tla
\*
\* Production configuration: both premises are enforced, so a Managed plain
\* writable unlock may stage its bytes, take a FIFO reservation, rotate the
\* rename ring synchronously, and hand the byte materialization to the
\* commit-replay offload worker without any draw observing different content
\* than it observes on today's synchronous path.
\*
\* Run with:
\*   tlc BufferMutationOffload.tla -config BufferMutationOffload.cfg

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* ── Constants ──────────────────────────────────────────────────────
\* Three backings match BufferBackingVersioning.tla's `{b1,b2,b3}`, whose
\* selection rule this model imports as `BackingFreeForRotation`. Two would be
\* enough to reach every ordering interleaving, but a two-entry ring can leave
\* a rotation with no admissible target once two live chunks have captured
\* different entries; production grows the ring instead (`UploadFresh`), and
\* the third entry is how this model keeps that stall out of the state space
\* rather than mistaking it for coverage.
\*
\* Three chunks and two mutations are the smallest domain that carries the
\* whole obligation: chunk -> mutation -> chunk is the minimum for "applied
\* after A's replay and before B's replay", and the third chunk plus the second
\* mutation add the A -> B -> A backing reuse that `NoLiveCaptureOverwritten`
\* is about, per rendering_correctness.rules.md's small-domain guidance.
\*
\* MAX_ORDINAL = 6 is one more than the five items can consume, which is what
\* leaves room for exactly one AbortReserve to burn a position and the run to
\* continue past it.
CONSTANTS
  Backings = {b1, b2, b3}
  NoBacking = none
  NumChunks = 3
  NumMutations = 2
  MAX_ORDINAL = 6
  FifoDiscipline = "Enforced"
  RotationDiscipline = "Synchronous"

\* ── Invariants ─────────────────────────────────────────────────────
INVARIANT TypeOK
\* R-BACK-44.4: the visibility contract the mode exists to preserve.
INVARIANT EncodeReadsAppliedBytes
\* R-BACK-44.2 step 2: rotation is synchronous, so a capture is never stale.
INVARIANT SnapshotRevisionIsCurrent
\* The R-BACK-5.11 reuse rule, imported: a live capture is never retargeted.
INVARIANT NoLiveCaptureOverwritten
\* R-BACK-44.3: the one-queue ordering premise, stated directly.
INVARIANT FifoApplicationOrder
INVARIANT OrdinalsAreUnique
\* R-BACK-44.2: a rejected reservation published nothing.
INVARIANT PublishedRevisionCount
INVARIANT RecordRevisionCountsRotations
\* R-BACK-44.2a: the committed task owns a concrete ring entry.
INVARIANT TaskCarriesRotatedTarget

\* ── Action properties ──────────────────────────────────────────────
PROPERTY RecordRevisionMonotonic
PROPERTY LogicalRevisionMonotonic
PROPERTY OrdinalMonotonic
