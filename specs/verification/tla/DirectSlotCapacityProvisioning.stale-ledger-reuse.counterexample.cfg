\* R-BACK-2.105, premise 3 removed: reuse skips the aggregate lease entirely,
\* so it may only be taken while the ledger entry still describes the payload
\* exactly. With the qualification dropped and a lease denied after the first
\* provision, the payload grows by ordinary exact-fit reservation while the
\* ledger keeps the pre-growth figure; a later source then finds complete
\* physical coverage and reuses on the strength of a stale aggregate.
SPECIFICATION Spec

CONSTANTS
  ProvisionDiscipline = "Enforced"
  EmptyOnlyDiscipline = "Enforced"
  ReuseDiscipline = "Enforced"
  RetentionDiscipline = "Enforced"
  ReuseQualification = "Removed"
  LeaseDiscipline = "DeniedAfterFirst"
  Budget = 4

INVARIANTS
  TypeOK
  ReuseIsLedgerQualified
  ProvisionOnlyWhenEmpty
  NoGrowWhilePopulated
  CapacityBoundsConstruction
  BoundaryCreditsNotExceeded
  NoRedundantReprovision
  ReuseRequiresCompleteRetention
