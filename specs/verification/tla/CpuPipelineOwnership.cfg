SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
  MaxSources = 3
  Capacity = 1
  RequiredParts = 2
  PresentSources = {2}
  ParallelSources = {1}
  FailureSources = {1}
  StateOnlySources = {3}
  AllowShutdown = TRUE
  WakeDiscipline = "Notify"
  PublicationDiscipline = "Complete"
  JoinDiscipline = "AfterJoin"
  ReclaimDiscipline = "AfterCompletion"

INVARIANT TypeOK
INVARIANT OccupancyExact
INVARIANT PublicationIsComplete
INVARIANT BorrowIsSynchronous
INVARIANT CompletionAuthorityAfterJoin
INVARIANT NoPrematureReclaim
INVARIANT CompletedPrefix
INVARIANT PresentCompletionOrdered
INVARIANT AdmissionReleaseNotifies

PROPERTY EverySourceEventuallyReclaimed
PROPERTY PresentOnlySourceEventuallyCompletes
PROPERTY AdmissionWaitEventuallyRetries
