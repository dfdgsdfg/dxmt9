\* TLC model checker configuration for WireHandleGeneration.tla
\*
\* Run with:
\*   tlc WireHandleGeneration.tla -config WireHandleGeneration.cfg
\*
\* The model is intentionally small so TLC completes in tens of seconds.
\* `GENERATION_DOMAIN = 3` is the minimum useful value: it forces the
\* `NextGen` wrap (1 → 2 → 1) so the model genuinely exercises both the
\* common "generation bump rejects stale wire entry" path and the
\* aliasing path described in `NoForwardInconsistency`'s commentary.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* ── Constants ──────────────────────────────────────────────────────
\* 2 handle slots × 2 wire entries × 3-element generation domain
\* (range 1..2 plus the NONE sentinel) × 3 destroy/reinsert cycles is
\* sufficient to cover the four invariants and both liveness properties
\* without blowing up TLC's state space.
CONSTANTS
  Handles            = {h1, h2}
  WireSlots          = {w1, w2}
  GENERATION_DOMAIN  = 3
  MAX_BUMPS          = 3

\* ── Invariants ─────────────────────────────────────────────────────
INVARIANT TypeOK
INVARIANT NoZombieAccept
INVARIANT LegacyNoneAlwaysAccepts
INVARIANT StampedMatchesArenaOnAdmit
INVARIANT NoForwardInconsistency

\* ── Liveness ───────────────────────────────────────────────────────
PROPERTY EventuallyDecided
PROPERTY EventuallyRejectStale
