\* Deliberate regression configuration for ProducerMarkReclaim.tla — premise 2.
\*
\* `RestampDiscipline = "Removed"` deletes exactly the re-stamp step: the
\* `WorkerRestamp` action and the `workerTicket = nextSeqId` guard on
\* `WorkerAppend`. Nothing else changes — pins still protect the mark window,
\* the reclaim gate is still the production gate, and marking is still
\* lock-free.
\*
\* This is the stamp-ticket vs slot-seq race the queue mutex used to make
\* unreachable for free. The worker reads its ticket with an acquire load,
\* stamps outside the mutex, and while it is stamping a `SlotAdvance` (another
\* actor force-publishing the open writing slot) raises the seq its records
\* will actually land under. The stamps end up BELOW the chunk's final seq,
\* the GPU watermark passes the stamp while that chunk is still pending, and
\* `gcArena` frees a record the encoder is still going to read.
\*
\* Expected to FAIL `NoUseAfterFree`. `WorkerAppendCoveredByStamps` — the
\* obligation stated directly — is deliberately NOT listed here so the fault
\* flag stays the reported violation; the production configuration checks it.
\* `scripts/check/verify_tla.sh` executes this configuration as an expected
\* failure and checks for that exact invariant.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
  Resources = {r1, r2}
  MAX_SEQID = 3
  PinDiscipline = "Enforced"
  RestampDiscipline = "Removed"

INVARIANT TypeOK
INVARIANT NoUseAfterFree
INVARIANT NoReclaimInsideMarkWindow
INVARIANT ReclaimRespectsWatermark
INVARIANT PinnedRecordsAreNotDestroyPending
INVARIANT MapReadSound
INVARIANT CommitStampsCoverChunkSeq
\* Both hold here: this configuration keeps the pin premise, which is what the
\* capture's existence obligation rests on.
INVARIANT NoCaptureAfterFree
INVARIANT StampsPrecedeCapture

PROPERTY MarkMonotonic
PROPERTY CompletedMonotonic
PROPERTY ObservedCompletedMonotonic
