\* TLC model checker configuration for CommandQueue.tla
\*
\* Run with:
\*   tlc CommandQueue.tla -config CommandQueue.cfg
\*
\* Or in the TLA+ Toolbox: create a model with these constants.
\*
\* State space with these values: ~2000 distinct states, ~6000 transitions.
\* Exhaustive BFS completes in a few seconds on a modern laptop.
\*
\* To test the production ratio (32 slots, 3 inflight) you can raise
\* RING_SIZE=6, MAX_INFLIGHT=3, MAX_SEQID=8 — larger but still tractable.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* ── Constants ──────────────────────────────────────────────────────
CONSTANTS
  RING_SIZE   = 4
  MAX_INFLIGHT = 2
  MAX_SEQID   = 6

\* ── Invariants (checked on every reachable state) ──────────────────
INVARIANT TypeOK
INVARIANT SeqIdSafety
INVARIANT BoundedInflight
INVARIANT RingSafety
INVARIANT EncodeSafety

\* MonotonicCompletion is a temporal safety property; check via PROPERTY.
PROPERTY MonotonicCompletion

\* ── Liveness (checked over all infinite behaviors) ─────────────────
PROPERTY PendingEventuallyFree
PROPERTY EventuallyDrained
