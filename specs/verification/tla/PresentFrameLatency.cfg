\* TLC model checker configuration for PresentFrameLatency.tla
\*
\* Run with:
\*   tlc PresentFrameLatency.tla -config PresentFrameLatency.cfg
\*
\* The small constants keep liveness checking tractable while covering:
\*   - MAX_FRAME_LATENCY = 1/2 style gating behavior via a bound of 2
\*   - present and non-present seq-id gaps
\*   - app wait, stop, encode, command completion, and present completion

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* -- Constants ------------------------------------------------------
CONSTANTS
  MAX_SEQID = 5
  MAX_FRAME_LATENCY = 2

\* -- Invariants -----------------------------------------------------
INVARIANT TypeOK
INVARIANT SeqTimelineSafety
INVARIANT PresentCompletionSafety
INVARIANT OutstandingPresentBound
INVARIANT PresentQueueSafety
INVARIANT PresentOrdinalCorrespondence
INVARIANT PresentOrdinalWaitIsomorphism

\* -- Temporal safety ------------------------------------------------
PROPERTY PresentCompletionActionSafe
PROPERTY AppWaitReturnSafe

\* -- Liveness -------------------------------------------------------
PROPERTY SubmittedPresentsEventuallyComplete
PROPERTY WaitEventuallyReturnsOrStops
