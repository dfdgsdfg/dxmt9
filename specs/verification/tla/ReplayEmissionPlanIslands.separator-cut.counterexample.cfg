\* Deliberate regression configuration for ReplayEmissionPlanIslands.tla.
\*
\* `SeparatorCutDiscipline = "Removed"` restores the whole-raw Legacy retry
\* that a post-materialization failure used to take. That retry was sound only
\* while a raw was indivisible: with a separator already executed, replaying
\* the raw through Legacy re-emits the committed first span and the separator
\* a second time.
\*
\* Expected to FAIL `NoLegacyRetryAfterSeparator`.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
  SpanIdentityDiscipline = "Enforced"
  RawLocalWitnessDiscipline = "Enforced"
  SeparatorCutDiscipline = "Removed"
  RunClosureDiscipline = "Enforced"

INVARIANT TypeOK
INVARIANT NoLegacyRetryAfterSeparator
