\* R-BACK-2.105, premise 1 removed: a reclaimed compatibility payload whose
\* retained storage already covers the plan is re-staged from scratch anyway.
\* This is what HEAD did -- `clearCommands()` retains every capacity, then the
\* empty arm frees and re-allocates the complete vector/lookup topology inside the
\* queue's critical section and swaps in a payload physically
\* indistinguishable from the one it discarded.
SPECIFICATION Spec

CONSTANTS
  ProvisionDiscipline = "Enforced"
  EmptyOnlyDiscipline = "Enforced"
  ReuseDiscipline = "Removed"
  RetentionDiscipline = "Enforced"
  ReuseQualification = "Enforced"
  LeaseDiscipline = "Settled"
  Budget = 4

INVARIANTS
  TypeOK
  NoRedundantReprovision
  ProvisionOnlyWhenEmpty
  NoGrowWhilePopulated
  CapacityBoundsConstruction
  BoundaryCreditsNotExceeded
  ReuseRequiresCompleteRetention
  ReuseIsLedgerQualified
