\* Expected failure: a failed queue/result dependency is ignored by Poll.
SPECIFICATION Spec
CONSTANTS Queries = {q1, q2}
           MaxGeneration = 2
           MaxPasses = 1
           MaxPending = 1
           Mutation = "IgnoreFailure"
INVARIANTS TypeOK IssueQualified ReleasedIdentityStable ReleasedNotActive
           ScopeIdentity IndependentContributions
           PendingCredits NoReadBeforeGpu SuccessHasNoPending FailedNeverSuccess
           NoStaleWrite NoLiveWriteAfterReclaim
CHECK_DEADLOCK FALSE
