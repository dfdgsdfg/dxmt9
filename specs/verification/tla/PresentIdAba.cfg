\* TLC model checker configuration for PresentIdAba.tla
\*
\* Domain sizing rationale:
\*   Slots    = {s1, s2}        — two slots is the smallest that exercises
\*                                cross-slot aliasing checks.
\*   Entities = {p1, p2}        — two distinct presenters is enough to
\*                                exercise StaleResolvesNull (re-register
\*                                in a freed slot must NOT alias the old
\*                                id onto the new entity).
\*   MAX_GEN  = 3               — deliberately small so generation wrap
\*                                is reachable; StaleResolvesNull is
\*                                quantified over UnwrappedIds so wrap
\*                                does not falsify the invariant, it
\*                                instead documents the assumption.
\*   MAX_OPS  = 6               — three full register+unregister cycles
\*                                per slot is sufficient to drive wrap
\*                                under MAX_GEN = 3.
\*
\* These bounds keep the reachable state space under a few hundred
\* thousand states so TLC finishes in seconds, matching the budget
\* the other modules in this directory observe.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

\* ── Constants ──────────────────────────────────────────────────────
CONSTANTS
  Slots    = {s1, s2}
  Entities = {p1, p2}
  MAX_GEN  = 3
  MAX_OPS  = 6

\* ── Invariants ─────────────────────────────────────────────────────
INVARIANT TypeOK
INVARIANT StaleResolvesNull
INVARIANT NoCrossSlotAlias
INVARIANT GenerationOverflowDocumented

\* ── Temporal safety ────────────────────────────────────────────────
PROPERTY GenerationMonotone

\* ── Liveness ───────────────────────────────────────────────────────
PROPERTY EventualReclaim
