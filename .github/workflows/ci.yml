name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  host-unit:
    name: Host build + tests (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # TLC (scripts/check/verify_tla.sh) needs a Java runtime; it
      # downloads tla2tools.jar itself.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build tools
        run: brew install meson ninja

      - name: Configure
        run: meson setup build

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs
