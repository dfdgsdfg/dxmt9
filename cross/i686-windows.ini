# Cross-compilation file for building the Win32 PE bridge stack
# (`d3d9.dll` + `dxmt9.dll`) targeting 32-bit Windows (i686).
#
# This is the WoW64 lane used by 32-bit D3D9 games under a 64-bit macOS Wine
# host. The resulting PE DLLs are staged into:
#   - <prefix>/drive_c/windows/syswow64/d3d9.dll
#   - <wine-root>/lib/wine/i386-windows/dxmt9.dll
#
# The unix-side module remains the normal x86_64 Wine unixlib module:
#   - <wine-root>/lib/wine/x86_64-unix/dxmt9.so
#
# Requires llvm-mingw on PATH:
#   export PATH=~/llvm-mingw/bin:$PATH
#
# Build the PE DLLs:
#   meson setup build-win32-x86-builtin \
#     --cross-file cross/i686-windows.ini \
#     -Dwine_builtin_dll=true \
#     -Dwine_install_path=/path/to/wine/toolchain
#   meson compile -C build-win32-x86-builtin

[host_machine]
system     = 'windows'
cpu_family = 'x86'
cpu        = 'i686'
endian     = 'little'

[binaries]
c       = 'i686-w64-mingw32-clang'
cpp     = 'i686-w64-mingw32-clang++'
ar      = 'i686-w64-mingw32-ar'
strip   = 'i686-w64-mingw32-strip'
windres = 'i686-w64-mingw32-windres'
dlltool = 'i686-w64-mingw32-dlltool'
