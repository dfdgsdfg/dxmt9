# Cross-compilation file for building the Win32 PE bridge stack
# (`d3d9.dll` + `winemetal.dll`) targeting x86_64 Windows
# (runs under Rosetta 2 via x86_64 Wine / GPTK).
#
# Requires llvm-mingw (https://github.com/mstorsjo/llvm-mingw):
#   export PATH=~/llvm-mingw/bin:$PATH
#
# Build the PE DLLs:
#   meson setup build-win32-x64-builtin \
#     --cross-file cross/x86_64-windows.ini \
#     -Dwine_builtin_dll=true \
#     -Dwine_build_path=/path/to/wine-build
#   meson compile -C build-win32-x64-builtin
#
# Install (Wine builtin layout):
#   cp build-win32-x64-builtin/src/win32/d3d9.dll \
#      "$WINE_ROOT/lib/wine/x86_64-windows/d3d9.dll"
#   cp build-win32-x64-builtin/src/winemetal/winemetal.dll \
#      "$WINE_ROOT/lib/wine/x86_64-windows/winemetal.dll"
#   cp build-x86_64-builtin/src/winemetal/unix/winemetal.so \
#      "$WINE_ROOT/lib/wine/x86_64-unix/winemetal.so"
#   WINEDLLOVERRIDES="d3d9=b" wine64 app.exe

[host_machine]
system    = 'windows'
cpu_family = 'x86_64'
cpu       = 'x86_64'
endian    = 'little'

[binaries]
c       = '/Users/dididi/llvm-mingw/bin/x86_64-w64-mingw32-clang'
cpp     = '/Users/dididi/llvm-mingw/bin/x86_64-w64-mingw32-clang++'
ar      = '/Users/dididi/llvm-mingw/bin/llvm-ar'
strip   = '/Users/dididi/llvm-mingw/bin/llvm-strip'
windres = '/Users/dididi/llvm-mingw/bin/llvm-windres'
dlltool = '/Users/dididi/llvm-mingw/bin/llvm-dlltool'
