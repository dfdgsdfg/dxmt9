# Cross-compilation file for building the Win32 PE bridge stack
# (`d3d9.dll` + `dxmt9.dll`) targeting x86_64 Windows
# (runs under Rosetta 2 via x86_64 Wine / GPTK).
#
# Requires llvm-mingw (https://github.com/mstorsjo/llvm-mingw):
#   export PATH=~/llvm-mingw/bin:$PATH
#
# Build the PE DLLs:
#   meson setup build-win32-x64 --cross-file cross/x86_64-windows.ini
#   meson compile -C build-win32-x64
#
# Install (DXMT-style layout, using GPTK wine64):
#   cp build-win32-x64/src/win32/d3d9.dll ~/.wine-gptk/drive_c/windows/system32/
#   cp build-win32-x64/src/win32/dxmt9.dll \
#      "/Applications/Game Porting Toolkit.app/Contents/Resources/wine/lib/wine/x86_64-windows/"
#   cp build/src/dxmt9.so \
#      "/Applications/Game Porting Toolkit.app/Contents/Resources/wine/lib/wine/x86_64-unix/"
#   WINEDLLOVERRIDES="d3d9=n,b" wine64 app.exe

[host_machine]
system    = 'windows'
cpu_family = 'x86_64'
cpu       = 'x86_64'
endian    = 'little'

[binaries]
c       = 'x86_64-w64-mingw32-clang'
cpp     = 'x86_64-w64-mingw32-clang++'
ar      = 'x86_64-w64-mingw32-ar'
strip   = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
dlltool = 'x86_64-w64-mingw32-dlltool'
