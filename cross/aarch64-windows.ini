# Cross-compilation file for building the Win32 d3d9.dll PE wrapper
# targeting ARM64 Windows (Apple Silicon / Wine).
#
# Requires llvm-mingw (https://github.com/mstorsjo/llvm-mingw):
#   brew install --cask llvm-mingw
# or download a pre-built release and put it on PATH as:
#   export PATH=/opt/llvm-mingw/bin:$PATH
#
# Build the PE DLL:
#   meson setup build-win32 --cross-file cross/aarch64-windows.ini
#   meson compile -C build-win32
#
# Install:
#   cp build/src/libdxmt9.dylib ~/.wine/drive_c/windows/system32/dxmt9.dll
#   cp build-win32/src/win32/d3d9.dll ~/.wine/drive_c/windows/system32/
#   WINEDLLOVERRIDES="d3d9=n,b" wine app.exe

[host_machine]
system    = 'windows'
cpu_family = 'aarch64'
cpu       = 'aarch64'
endian    = 'little'

[binaries]
c       = 'aarch64-w64-mingw32-clang'
cpp     = 'aarch64-w64-mingw32-clang++'
ar      = 'aarch64-w64-mingw32-ar'
strip   = 'aarch64-w64-mingw32-strip'
windres = 'aarch64-w64-mingw32-windres'
dlltool = 'aarch64-w64-mingw32-dlltool'

[properties]
# Path to the pre-built libdxmt9.dylib import stub (.dll.a).
# Generated automatically by the meson build; override here if needed.
# dxmt9_import_lib = '/path/to/libdxmt9.dll.a'
