# Stable PE D3D9DeviceImpl audit contract.  This file describes identities and
# ownership; it intentionally contains no RVAs, timestamps, archive order,
# relocations, or whole-object hashes.
schema = "dxmt9.pe_device.audit.v1"

[toolchain]
builtin_dll = true
compiler_family = "llvm-mingw"
compiler_id = "clang"
linker_id = "ld.lld"
configuration = "release"

[recorder_state]
sizeof_x64 = 104648
sizeof_x86 = 103704
sizeof_host = 104672

[device_layout]
sizeof_x64 = 107152
alignof_x64 = 8
sizeof_x86 = 105872
alignof_x86 = 8

[layout]
critical_member_order = [
  "refs_", "dev_", "factory_", "recorderState_", "stateBlockContext_",
  "bufferContext_",
  "surfaceTextureContext_", "queryContext_", "presentationContext_",
  "shaderDeclarationContext_", "peCaptureState_", "diagnostics_"
]
# State implementations have real translation-unit ownership; no class-body
# include fragment is permitted.
state_fragment_residual_max_lines = 0
device_impl_max_lines = 3713
retained_inline_entries = [
  "SetStreamSource", "Present", "DrawIndexedPrimitive"
]
retained_inline_helpers = [
  "maxPendingCommandBytes", "maxPendingCommandRecords", "setRecordedRef",
  "setRecordedStreamRef", "shadowedStreamSourceEquals", "PeCallScope",
  "PeHotStateSetterTimer", "withPeCallScope", "withPeCallAndHotStateSetter",
  "validateConstRangeFast", "applyConstStateWrite",
  "prepareSoftwareDrawCandidate", "drawPrimitiveCore", "AppendPhaseTimer",
  "notePeDeviceCallAfterPresent", "pushPeCallScope", "notePeCallScopeReturn",
  "popPeCallScope"
]

[exports]
names = [
  "20 Direct3DCreate9On12", "24 Direct3DShaderValidatorCreate9",
  "27 D3DPERF_BeginEvent", "28 D3DPERF_EndEvent", "29 D3DPERF_GetStatus",
  "30 D3DPERF_QueryRepeatFrame", "31 D3DPERF_SetMarker",
  "32 D3DPERF_SetOptions", "33 D3DPERF_SetRegion", "35 DebugSetMute",
  "37 Direct3DCreate9", "38 Direct3DCreate9Ex"
]

[owners]
query_interface = "src/d3d9/d3d9_pe_device.cpp"
hot_state_draw = "src/d3d9/d3d9_pe_device.cpp"
vtable = "src/d3d9/d3d9_pe_device.cpp"
rtti = "src/d3d9/d3d9_pe_device.cpp"
vtable_refptr = ["src/d3d9/d3d9_pe_device_com_cold.cpp"]
recorder = "src/d3d9/d3d9_pe_device_recorder.cpp"
com_cold = "src/d3d9/d3d9_pe_device_com_cold.cpp"
state_block_prepare = "src/d3d9/d3d9_pe_device_com_cold.cpp"
state_block_commit = "src/d3d9/d3d9_pe_device_com_cold.cpp"
fvf_resolver = "src/d3d9/d3d9_pe_device_com_cold.cpp"
constant_validation = "src/d3d9/d3d9_pe_device_com_cold.cpp"
constant_slow_bodies = "src/d3d9/d3d9_pe_device_com_cold.cpp"
diagnostics = "src/d3d9/d3d9_pe_device_diag.cpp"
swvp = "src/d3d9/d3d9_pe_device_swvp.cpp"
tape = "src/d3d9/d3d9_pe_device_tape.cpp"
tape_registry = "src/d3d9/d3d9_pe_device_tape_registry.cpp"
tape_child = "src/d3d9/d3d9_pe_device_tape_child.cpp"

[hot]
symbols = [
  "QueryInterface", "BeginScene", "SetRenderState", "SetStreamSource",
  "SetVertexShaderConstantF", "SetPixelShaderConstantF", "DrawPrimitive",
  "DrawIndexedPrimitive", "Present", "appendRecord",
  "setRenderStateCore", "applyConstStateWrite"
]
fast_path_symbols = ["SetVertexShaderConstantF", "SetPixelShaderConstantF"]

[forbidden_fields]
unstable = ["address", "rva", "timestamp", "archive_order", "relocation", "assembly_hash"]
