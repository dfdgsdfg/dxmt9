# R-TEST-13 module-boundary harness manifest.
# Runtime execution can depend on local Wine and cross-build artifacts; this
# manifest/check layer is intentionally runnable without Wine.

schema = 1

valid_lanes = ["provider-side", "app-local", "builtin"]
valid_arches = ["native", "x64", "x86"]

[[case]]
id = "artifact-staging"
title = "Stage built PE and unix provider artifacts"
status = "scaffolded"
owner = "tests/module_boundary"
requirements = ["R-TEST-13.1", "R-TEST-13.2", "R-TEST-13.7"]
lanes = ["app-local", "builtin"]
arches = ["x64", "x86"]
cost_class = "compile-time-test-only"
failure_categories = ["artifact-staging"]
checks = [
  "d3d9.dll present and hashed",
  "winemetal.dll present and hashed",
  "winemetal.so present and hashed",
  "MinGW runtime DLL dependencies present and hashed when required",
  "Wine unix dylib siblings present and hashed when required",
  "artifact architecture recorded",
  "bridge ABI hash recorded",
]
acceptance = [
  "result JSON lists every staged artifact with role, path, sha256, and byte size",
  "missing artifacts fail before Wine launch",
]

[[case]]
id = "provider-side-probe"
title = "Probe built unix provider without PE frontend"
status = "scaffolded"
owner = "tests/module_boundary"
requirements = ["R-TEST-13.6", "R-TEST-13.7", "R-TEST-13.8"]
lanes = ["provider-side"]
arches = ["native"]
cost_class = "compile-time-test-only"
failure_categories = ["unix-module-load", "provider-entry-dispatch", "command-submission"]
checks = [
  "built provider path exists",
  "provider ABI entry is discoverable",
  "PE D3D9 and PE bridge bypass are recorded",
  "minimal provider call or chunk submission emits status",
]
acceptance = [
  "provider-side result explicitly states which PE/Wine layers were bypassed",
  "provider failure is classified before app-local/builtin lanes run",
]

[[case]]
id = "app-local-loader-smoke"
title = "Run PE probe with app-local d3d9/winemetal overrides"
status = "todo"
owner = "tests/module_boundary"
requirements = ["R-TEST-13.3", "R-TEST-13.5", "R-TEST-13.7", "R-TEST-13.8"]
lanes = ["app-local"]
arches = ["x64", "x86"]
cost_class = "compile-time-test-only"
failure_categories = [
  "pe-loader-export",
  "bridge-abi-mismatch",
  "unix-module-load",
  "provider-entry-dispatch",
  "public-d3d9-smoke",
  "command-submission",
  "unsupported-runtime",
]
checks = [
  "LoadLibrary d3d9.dll resolves staged DLL",
  "Direct3DCreate9 or Direct3DCreate9Ex export resolves",
  "staged winemetal.dll bridge is used",
  "DXMT9_WINEMETAL_SO provider path is used",
  "minimal D3D9 factory and submission smoke crosses bridge",
]
acceptance = [
  "app-local run emits dxmt9.module_boundary.result.v1 JSON",
  "process exit success is not sufficient without per-check pass records",
]

[[case]]
id = "builtin-loader-smoke"
title = "Run PE probe through Wine builtin/native layout"
status = "todo"
owner = "tests/module_boundary"
requirements = ["R-TEST-13.4", "R-TEST-13.5", "R-TEST-13.7", "R-TEST-13.8"]
lanes = ["builtin"]
arches = ["x64", "x86"]
cost_class = "compile-time-test-only"
failure_categories = [
  "pe-loader-export",
  "bridge-abi-mismatch",
  "unix-module-load",
  "provider-entry-dispatch",
  "public-d3d9-smoke",
  "command-submission",
  "unsupported-runtime",
]
checks = [
  "Wine builtin/native DLL resolution selects installed dxmt9 artifacts",
  "builtin lane records installation or staging root",
  "minimal D3D9 factory and submission smoke crosses bridge",
]
acceptance = [
  "builtin evidence is recorded separately from app-local evidence",
  "builtin discovery failure is not counted as app-local failure",
]

[[case]]
id = "result-schema"
title = "Validate module-boundary result JSON shape"
status = "scaffolded"
owner = "tests/module_boundary"
requirements = ["R-TEST-13.7", "R-TEST-13.8", "R-TEST-13.9"]
lanes = ["provider-side", "app-local", "builtin"]
arches = ["native", "x64", "x86"]
cost_class = "compile-time-test-only"
failure_categories = [
  "artifact-staging",
  "pe-loader-export",
  "bridge-abi-mismatch",
  "unix-module-load",
  "provider-entry-dispatch",
  "public-d3d9-smoke",
  "command-submission",
  "unsupported-runtime",
]
checks = [
  "schema version",
  "lane and arch",
  "artifact hashes",
  "command and environment snapshot",
  "fixed failure category",
  "per-check statuses",
]
acceptance = [
  "runner --validate-manifest passes without Wine",
  "runner --emit-scaffold-result writes parseable dxmt9.module_boundary.result.v1 JSON",
]

[[case]]
id = "evidence-boundaries"
title = "Keep module-boundary evidence separate from conformance, WSI, and experiments"
status = "scaffolded"
owner = "tests/module_boundary"
requirements = ["R-TEST-13.10"]
lanes = ["provider-side", "app-local", "builtin"]
arches = ["native", "x64", "x86"]
cost_class = "compile-time-test-only"
failure_categories = ["unsupported-runtime"]
checks = [
  "manifest cases map only to module-boundary requirements",
  "runner does not use screenshot, SSIM, frame timing, or app-level pass criteria",
]
acceptance = [
  "module-boundary result cannot claim Wine-oracle conformance or wild experiment success",
]
