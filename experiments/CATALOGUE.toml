[apps.dxmt9-perf-ffp-only.expected_counters]
# At least 100 draws total, with at least one FFP VS+PS uniform call
# (i.e. the FFP shader path actually ran). The HLSL VS uniform path must
# stay at 0 because this probe is FFP-only by construction.
# gpu_command_buffer_errors must stay at 0 — any GPU fault during a
# perf probe is a regression (M5 L3 sentinel).
draw_calls = { min = 100 }
uniform_ffp_vs_calls = { min = 1 }
uniform_ffp_ps_calls = { min = 1 }
uniform_vs_consts_calls = { max = 0 }
gpu_command_buffer_errors = { max = 0 }

[apps.dxmt9-perf-multi-rt.expected_counters]
# At least 50 draws total. The probe rotates through 4 color render
# targets and clears each, so the aggregate color-load-action-clear
# counter must be at least 2 (a regression to a single RT or no
# pass-rotation collapses this to 0/1).
draw_calls = { min = 50 }
render_pass_load_action_clear = { min = 2 }
gpu_command_buffer_errors = { max = 0 }

[apps.dxmt9-perf-depth-heavy.expected_counters]
# At least 50 draws total and at least one DontCare depth-store event,
# i.e. a shadow-map style pass that discards the depth buffer at the end.
draw_calls = { min = 50 }
render_pass_store_action_depth_dontcare = { min = 1 }
gpu_command_buffer_errors = { max = 0 }

[apps.dxmt9-perf-skeletal.expected_counters]
# At least 50 draws total with several volatile uniform pushes
# (skeletal animation reuploads bone palettes per draw).
draw_calls = { min = 50 }
uniform_volatile_pushes = { min = 1 }
gpu_command_buffer_errors = { max = 0 }

[apps.dxmt9-perf-bridge-empty.expected_counters]
# V1 boundary B2 (audit item (b)) — bridge-ABI throughput probe.
# chunk_admit >= 50000 proves the loop ran and at least half of the
# default 100000 iterations reached the unix-side import success exit.
# The threshold is conservative: we accept a Clear-record coalescing
# factor up to 2x (some d3d9 frontends batch consecutive Clears into a
# single chunk). gpu_command_buffer_errors must stay at 0 — boundary
# isolation does not exempt a probe from the M5 sentinel.
chunk_admit = { min = 50000 }
gpu_command_buffer_errors = { max = 0 }

[apps.dxmt9-perf-encode-replay.expected_counters]
# Boundary-isolated encode-only probe (V1 audit (c), B3+B4):
# - command_buffers >= 1 proves at least one MTLCommandBuffer was built
#   from the captured chunk stream (B3 queue tracker fired).
# - encode_chunk_calls >= 1 proves the encode thread actually consumed
#   the chunk(s) and produced encoded work (B4 encode thread fired).
# Conservative bounds — boundary isolation is the intent, not draw-count
# coverage. Exact draw counts depend on the recorder's chunk capacity
# splitting policy and ENCODE_REPLAY_* env vars.
# gpu_command_buffer_errors must stay at 0 — same M5 L3 sentinel as the
# other perf probes.
command_buffers = { min = 1 }
encode_chunk_calls = { min = 1 }
gpu_command_buffer_errors = { max = 0 }

