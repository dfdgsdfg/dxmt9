[apps.dxmt9-perf-present-loop.expected_counters]
# V1 audit (f) — drawable-acquire isolation (B6). The probe runs
# PRESENT_LOOP_ITERATIONS empty Clear+Present cycles (default 1000) so
# the existing present_* counter family reflects only B6 cost.
# Conservative gate: at least 500 presents must reach the encoder
# (proves the loop ran enough iterations for B6 timing distributions
# to be meaningful). gpu_command_buffer_errors must stay at 0 — any
# GPU fault during a perf probe is a regression (M5 L3 sentinel).
present_encoded = { min = 500 }
gpu_command_buffer_errors = { max = 0 }

[apps.dxmt9-perf-chain-parametric.expected_counters]
# V1 audit (e) — sub-CB chain sensitivity probe (B3+B4). The probe is
# designed to be re-run under different DXMT9_MID_CHUNK_COMMIT_POLICY /
# DXMT9_MID_CHUNK_COMMIT_CAP_PER_RENDER_PASS combinations from the W4
# A/B harness, so chunk_subcb_count_max is intentionally NOT gated here
# (its value depends on the cap policy under test, which is OFF by
# default). Conservative gates only:
# - command_buffers >= 1 proves chunks reached the encode thread and at
#   least one MTLCommandBuffer was built.
# - render_pass_begin >= 1 proves the chain itself ran (each chain RT
#   switch should produce a non-Final flushRender → renderPassBegin).
# - gpu_command_buffer_errors == 0 matches the M5 L3 sentinel
#   convention used by all perf probes.
command_buffers = { min = 1 }
render_pass_begin = { min = 1 }
gpu_command_buffer_errors = { max = 0 }
