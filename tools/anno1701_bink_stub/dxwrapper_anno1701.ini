;; Temporary oracle config for Anno 1701 startup-path experiments.
;; This is not part of dxmt9 runtime; it exists to compare behavior against
;; dxwrapper's DirectDraw 7 -> Direct3D 9 compatibility layer.

[General]
RealDllPath                = AUTO
WrapperMode                = AUTO
DisableLogging             = 0

[Compatibility]
Dd7to9                     = 1
EnableDdrawWrapper         = 1
EnableD3d9Wrapper          = 1

[ddraw]
DdrawUseDirect3D9Caps      = 1
DirectShowEmulation        = 1

[Dd7to9]
DdrawIntroVideoFix         = 1
DdrawLimitTextureFormats   = 1
DdrawLimitDisplayModeCount = 1

[d3d9]
EnableVSync                = 0
LimitDisplayModeCount      = 1
